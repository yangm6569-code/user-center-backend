<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report Web</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18202e;
      --muted: #667085;
      --line: #d7dde8;
      --panel: #ffffff;
      --page: #f1f4f8;
      --accent: #315f9f;
      --accent-strong: #244879;
      --danger: #b42318;
      --ok: #067647;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #fbfcfe 0%, var(--page) 100%);
    }
    main {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 760;
      letter-spacing: 0;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid #b7c7de;
      border-radius: 999px;
      color: var(--accent-strong);
      background: #eff5ff;
      font-size: 14px;
      white-space: nowrap;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(28, 39, 63, 0.08);
    }
    h2 {
      margin: 0 0 14px;
      font-size: 17px;
      letter-spacing: 0;
    }
    .status {
      min-height: 44px;
      margin: 0 0 14px;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #d0d5dd;
      background: #f8fafc;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }
    .status.ok {
      border-color: #abefc6;
      background: #ecfdf3;
      color: var(--ok);
    }
    .status.error {
      border-color: #fecdca;
      background: #fef3f2;
      color: var(--danger);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    button {
      min-height: 40px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .primary {
      color: white;
      background: var(--accent);
    }
    .ghost {
      color: #344054;
      background: #eef2f6;
    }
    pre {
      min-height: 360px;
      overflow: auto;
      margin: 0;
      padding: 14px;
      border-radius: 6px;
      background: #101828;
      color: #d0d5dd;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    @media (max-width: 760px) {
      main { padding: 24px 0; }
      header { align-items: start; flex-direction: column; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Report Web</h1>
    <span class="badge">client_id: report-web</span>
  </header>

  <section>
    <h2>访问结果</h2>
    <div id="status" class="status">正在检查登录状态...</div>
    <div class="actions">
      <button class="primary" id="loginBtn">重新认证</button>
      <button class="ghost" id="clearBtn">清空本应用 Token</button>
    </div>
    <pre id="output">{}</pre>
  </section>
</main>

<script>
  const clientId = "report-web";
  const tokenKey = "reportAccessToken";
  const redirectUri = `${location.origin}/demo-apps/report/index.html`;
  const statusEl = document.querySelector("#status");
  const outputEl = document.querySelector("#output");

  document.querySelector("#loginBtn").addEventListener("click", () => authorize(true));
  document.querySelector("#clearBtn").addEventListener("click", () => {
    sessionStorage.removeItem(tokenKey);
    authorize(true);
  });

  boot();

  function boot() {
    const params = new URL(location.href).searchParams;
    const error = params.get("error");
    const code = params.get("code");
    if (error) {
      history.replaceState({}, "", redirectUri);
      setStatus(`${error}: ${params.get("error_description") || "无权限访问"}`, "error");
      render({ error, errorDescription: params.get("error_description") });
      return;
    }
    if (code) {
      history.replaceState({}, "", redirectUri);
      exchange(code);
      return;
    }
    const token = sessionStorage.getItem(tokenKey);
    if (token) {
      renderToken(token, "已登录 Report");
      return;
    }
    authorize(false);
  }

  function authorize(force) {
    if (force) sessionStorage.removeItem(tokenKey);
    setStatus("正在跳转用户中台...", "");
    location.href = `/oauth/authorize?client_id=${encodeURIComponent(clientId)}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code&state=${Date.now()}`;
  }

  async function exchange(code) {
    setStatus("正在换取 Token...", "");
    const response = await fetch("/oauth/token", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        grant_type: "authorization_code",
        client_id: clientId,
        redirect_uri: redirectUri,
        code
      })
    });
    const body = await response.json();
    if (!response.ok) {
      setStatus(`${response.status} ${body.code || "ERROR"}`, "error");
      render(body);
      return;
    }
    sessionStorage.setItem(tokenKey, body.accessToken);
    renderToken(body.accessToken, "Report 登录成功");
  }

  function renderToken(token, message) {
    const claims = decodeJwt(token);
    setStatus(message, "ok");
    render({
      tokenType: "Bearer",
      claims,
      accessTokenPreview: `${token.slice(0, 48)}...`
    });
  }

  function decodeJwt(token) {
    const payload = token.split(".")[1];
    const normalized = payload.replace(/-/g, "+").replace(/_/g, "/");
    const json = decodeURIComponent(Array.from(atob(normalized), c =>
      "%" + c.charCodeAt(0).toString(16).padStart(2, "0")
    ).join(""));
    return JSON.parse(json);
  }

  function setStatus(message, type) {
    statusEl.className = `status ${type || ""}`;
    statusEl.textContent = message;
  }

  function render(value) {
    outputEl.textContent = JSON.stringify(value, null, 2);
  }
</script>
</body>
</html>
