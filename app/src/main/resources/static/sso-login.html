<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户中台登录</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18202e;
      --muted: #667085;
      --line: #d7dde8;
      --panel: #ffffff;
      --page: #eef3f8;
      --accent: #126b57;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f8fafc 0%, var(--page) 100%);
    }
    main {
      width: min(420px, calc(100% - 32px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(28, 39, 63, 0.12);
    }
    h1 {
      margin: 0 0 18px;
      font-size: 28px;
      letter-spacing: 0;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      color: var(--muted);
      font-size: 13px;
    }
    input {
      width: 100%;
      height: 42px;
      border: 1px solid #c9d2df;
      border-radius: 6px;
      padding: 0 11px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }
    button {
      width: 100%;
      min-height: 42px;
      margin-top: 18px;
      border: 0;
      border-radius: 6px;
      color: white;
      background: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .status {
      min-height: 42px;
      margin-top: 16px;
      padding: 11px;
      border-radius: 6px;
      border: 1px solid #d0d5dd;
      background: #f8fafc;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    .status.error {
      border-color: #fecdca;
      background: #fef3f2;
      color: var(--danger);
    }
  </style>
</head>
<body>
<main>
  <h1>用户中台登录</h1>
  <label for="username">账号</label>
  <input id="username" autocomplete="username">
  <label for="password">密码</label>
  <input id="password" type="password" autocomplete="current-password">
  <button id="loginBtn">登录并返回应用</button>
  <div id="status" class="status">登录成功后会继续原来的 SSO 授权请求</div>
</main>

<script>
  const statusEl = document.querySelector("#status");
  const returnTo = new URL(location.href).searchParams.get("return_to") || "/";
  const loginClientId = resolveLoginClientId(returnTo);

  document.querySelector("#loginBtn").addEventListener("click", async () => {
    setStatus("正在登录...", "");
    const response = await fetch("/api/v1/auth/login", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.querySelector("#username").value,
        password: document.querySelector("#password").value,
        clientId: loginClientId,
        deviceId: "sso-login-page"
      })
    });
    const body = await response.json();
    if (!response.ok) {
      setStatus(`${response.status} ${body.code || "ERROR"} ${body.message || ""}`, "error");
      return;
    }
    location.href = returnTo;
  });

  function setStatus(message, type) {
    statusEl.className = `status ${type || ""}`;
    statusEl.textContent = message;
  }

  function resolveLoginClientId(returnTo) {
    try {
      const authorizeUrl = new URL(returnTo, location.origin);
      return authorizeUrl.searchParams.get("client_id") || "user-center-console";
    } catch (e) {
      return "user-center-console";
    }
  }
</script>
</body>
</html>
