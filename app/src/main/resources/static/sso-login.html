<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户中台统一登录</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #1677ff;
      --primary-soft: #69b1ff;
      --ink: #0b1b44;
      --muted: #5f6f8f;
      --line: #e5eaf0;
      --danger: #d92d20;
      --danger-bg: #fff1f0;
      --panel: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background: #f5f7fa;
    }

    .login-shell {
      position: relative;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 32px;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(22, 119, 255, 0.10), transparent 28%),
        radial-gradient(circle at 78% 18%, rgba(105, 177, 255, 0.18), transparent 30%),
        linear-gradient(180deg, #ffffff 0%, #f5f7fa 100%);
    }

    .login-shell::before {
      position: absolute;
      inset: 0;
      pointer-events: none;
      content: "";
      background-image:
        linear-gradient(rgba(22, 119, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(22, 119, 255, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.45), transparent 64%);
    }

    .login-visual {
      position: absolute;
      top: 9%;
      right: 11%;
      width: 260px;
      height: 190px;
      pointer-events: none;
    }

    .login-visual-platform {
      position: absolute;
      right: 36px;
      bottom: 28px;
      display: flex;
      width: 132px;
      height: 96px;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      border: 1px solid rgba(22, 119, 255, 0.18);
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.72), rgba(105, 177, 255, 0.24)),
        linear-gradient(135deg, var(--primary-soft), var(--primary));
      box-shadow:
        0 28px 60px rgba(22, 119, 255, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.70);
      transform: perspective(420px) rotateX(56deg) rotateZ(-38deg);
    }

    .login-visual-platform svg {
      width: 46px;
      height: 46px;
      filter: drop-shadow(0 8px 10px rgba(11, 27, 68, 0.20));
      transform: rotateZ(38deg) rotateX(-56deg);
    }

    .login-cube {
      position: absolute;
      display: block;
      border: 1px solid rgba(22, 119, 255, 0.16);
      border-radius: 10px;
      background: linear-gradient(145deg, #ffffff, #d8e9ff);
      box-shadow: 0 12px 26px rgba(22, 119, 255, 0.12);
      transform: rotate(45deg);
    }

    .login-cube-one {
      top: 24px;
      right: 42px;
      width: 34px;
      height: 34px;
    }

    .login-cube-two {
      top: 72px;
      left: 26px;
      width: 22px;
      height: 22px;
    }

    .login-cube-three {
      right: 2px;
      bottom: 62px;
      width: 18px;
      height: 18px;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: min(420px, calc(100vw - 32px));
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 24px 64px rgba(23, 119, 255, 0.10);
      backdrop-filter: blur(14px);
    }

    .login-logo {
      display: flex;
      width: 52px;
      height: 52px;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      color: #ffffff;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary-soft), var(--primary));
      box-shadow: 0 12px 28px rgba(22, 119, 255, 0.24);
    }

    .login-logo svg {
      width: 28px;
      height: 28px;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      text-align: center;
    }

    .field {
      position: relative;
      margin-bottom: 16px;
    }

    .field svg {
      position: absolute;
      top: 50%;
      left: 13px;
      width: 18px;
      height: 18px;
      color: #7b8aaa;
      transform: translateY(-50%);
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px 0 42px;
      outline: 0;
      color: var(--ink);
      background: #ffffff;
      font: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:hover,
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.10);
    }

    button {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary), #3c8cff);
      box-shadow: 0 12px 24px rgba(22, 119, 255, 0.22);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    button:hover {
      opacity: 0.94;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
      transform: none;
    }

    .status {
      min-height: 40px;
      margin-top: 16px;
      padding: 10px 12px;
      border: 1px solid #d6e4ff;
      border-radius: 8px;
      color: #315aa3;
      background: #f0f6ff;
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }

    .status.error {
      border-color: #ffccc7;
      color: var(--danger);
      background: var(--danger-bg);
    }

    .status.success {
      border-color: #b7eb8f;
      color: #237804;
      background: #f6ffed;
    }

    @media (max-width: 760px) {
      .login-shell {
        padding: 20px;
      }

      .login-visual {
        display: none;
      }

      .login-card {
        padding: 26px 22px;
      }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <div class="login-visual" aria-hidden="true">
      <div class="login-visual-platform">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 5 6v5c0 4.6 2.9 8.4 7 10 4.1-1.6 7-5.4 7-10V6l-7-3Z"></path>
          <path d="m9 12 2 2 4-5"></path>
        </svg>
      </div>
      <span class="login-cube login-cube-one"></span>
      <span class="login-cube login-cube-two"></span>
      <span class="login-cube login-cube-three"></span>
    </div>

    <section class="login-card" aria-label="统一登录">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 5 6v5c0 4.6 2.9 8.4 7 10 4.1-1.6 7-5.4 7-10V6l-7-3Z"></path>
          <path d="m9 12 2 2 4-5"></path>
        </svg>
      </div>
      <h1>用户中台</h1>
      <p class="subtitle">统一账号、角色权限、应用接入和审计管理</p>

      <form id="loginForm">
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21a8 8 0 0 0-16 0"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input id="username" name="username" autocomplete="username" placeholder="账号" value="admin">
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="11" width="16" height="10" rx="2"></rect>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
          </svg>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="密码">
        </div>

        <button id="loginBtn" type="submit">登录</button>
      </form>

      <div id="status" class="status">登录成功后会继续原来的 SSO 授权请求</div>
    </section>
  </main>

  <script>
    const statusEl = document.querySelector("#status");
    const loginBtn = document.querySelector("#loginBtn");
    const form = document.querySelector("#loginForm");
    const returnTo = new URL(location.href).searchParams.get("return_to") || "/";
    const loginClientId = resolveLoginClientId(returnTo);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const username = document.querySelector("#username").value.trim();
      const password = document.querySelector("#password").value;

      if (!username || !password) {
        setStatus("请输入账号和密码", "error");
        return;
      }

      setLoading(true);
      setStatus("正在登录...", "");

      try {
        const response = await fetch("/api/v1/auth/login", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username,
            password,
            clientId: loginClientId,
            deviceId: "sso-login-page"
          })
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok || (body.code && body.code !== "OK")) {
          setStatus(body.message || `${response.status} 登录失败`, "error");
          return;
        }
        setStatus("登录成功，正在返回应用...", "success");
        location.href = returnTo;
      } catch (error) {
        setStatus("登录请求失败，请确认用户中台服务正常运行", "error");
      } finally {
        setLoading(false);
      }
    });

    function setStatus(message, type) {
      statusEl.className = `status ${type || ""}`;
      statusEl.textContent = message;
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      loginBtn.textContent = loading ? "登录中..." : "登录";
    }

    function resolveLoginClientId(returnTo) {
      try {
        const authorizeUrl = new URL(returnTo, location.origin);
        return authorizeUrl.searchParams.get("client_id") || "user-center-console";
      } catch (e) {
        return "user-center-console";
      }
    }
  </script>
</body>
</html>
